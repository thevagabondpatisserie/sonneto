[project]
name = "sonneto"
authors = [{ name = "Công ty TNHH Patisserie Vagabond", email = "thevagabondbakery@gmail.com" }]
description = "Web Sonneto: trang giới thiệu, khoá học có hạn học (trên Frappe Learning), R&D cho quán"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
