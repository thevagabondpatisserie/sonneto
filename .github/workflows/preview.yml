name: Sonneto independent preview
on:
  push:
    paths: ['preview/**', '.github/workflows/preview.yml']
  pull_request:
    paths: ['preview/**', '.github/workflows/preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sonneto-static-preview
          path: preview/dist/
          if-no-files-found: error
